services:
  frankenphp:
    build: .
    ports:
      - "6767:80"
    volumes:
      - .:/app
    environment:
      - DB_HOST=mariadb
      - DB_USER=chandan
      - DB_PASS=chandan
      - DB_NAME=agms
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=agms
      - MYSQL_USER=chandan
      - MYSQL_PASSWORD=chandan
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./database:/docker-entrypoint-initdb.d/sql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mariadb_data:
